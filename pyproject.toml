[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-modal-financial"
version = "0.1.0"
description = "Multi-modal financial document RAG agent pipeline with hybrid BM25 dense vector reranking and citation grounding"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Portfolio Automation" }]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "pypdf>=3.0.0",
    "pillow>=9.0.0",
    "python-dotenv>=1.0.0",
    "typing_extensions>=4.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
multi-modal-financial = "multi_modal_financial.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["multi_modal_financial*"]

[tool.setuptools.package-data]
multi_modal_financial = ["py.typed"]

[tool.coverage.run]
source = ["multi_modal_financial"]
omit = ["tests/*"]

[tool.mypy]
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
